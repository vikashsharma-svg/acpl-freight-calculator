<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACPL Freight Calculator</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1a2230; --muted:#667085; --line:#e4e8ef;
  --brand:#0b5cad; --brand2:#0a4a8c; --accent:#f5a800; --good:#1a7f4b; --warn:#b26a00; --bad:#c02626;
  --chip:#eef4fb; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
.wrap{max-width:940px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.logo{background:var(--accent);color:#12233a;font-weight:800;letter-spacing:.5px;padding:8px 12px;border-radius:8px;font-size:20px}
h1{font-size:19px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.metabar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.metabar span{background:var(--chip);color:var(--brand2);border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;font-size:12px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 14px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin:0 0 5px}
.hint{font-weight:400;color:var(--muted);font-size:11.5px}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:9px;font-size:15px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,92,173,.12)}
.row{display:flex;gap:12px}.row>div{flex:1}
.field{margin-bottom:14px}
.toggles{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.tg{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--ink)}
.tg input{width:16px;height:16px;accent-color:var(--brand)}
.adv summary{cursor:pointer;font-size:12.5px;color:var(--brand);font-weight:600;margin-top:6px;user-select:none}
.adv[open] summary{margin-bottom:12px}
/* result */
.match{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.match .city{font-size:22px;font-weight:800}
.match .st{color:var(--muted);font-size:13px;font-weight:600}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.exact{background:#e6f4ec;color:var(--good)}
.pill.near{background:#fdf3e3;color:var(--warn)}
.pill.far{background:#fbe9e9;color:var(--bad)}
.rateline{font-size:13px;color:var(--muted);margin-bottom:14px}
.rateline b{color:var(--ink);font-size:15px}
.volbox{background:#f4f8f4;border:1px solid #d8e6d8;border-radius:9px;padding:9px 12px;font-size:12.5px;color:#33553a;margin-bottom:12px}
.volbox b{color:#1a3d24}
.veh{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#f8fbff,#eef4fb);
  border:1px solid #dbe7f5;border-radius:11px;padding:12px 14px;margin-bottom:16px}
.veh .ic{font-size:26px}
.veh .vt{font-weight:800;font-size:15px}
.veh .vs{font-size:11.5px;color:var(--muted)}
.fr{margin-top:4px}
.frbig{background:linear-gradient(180deg,#f0f7ff,#e7f1fb);border:1px solid #cfe0f2;border-radius:13px;padding:15px 16px}
.frtop{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.frtag{background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;text-transform:none;letter-spacing:0}
.frrange{font-size:27px;font-weight:800;color:var(--brand2);margin-top:4px;line-height:1.1}
.frsub{font-size:12px;color:var(--muted);margin-top:4px}
.frcompare{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.frcompare b{color:var(--ink)}
.vehexp{font-size:11.5px;color:var(--muted);margin:-8px 0 14px;line-height:1.5}
.vehexp b{color:var(--ink)}
.brhead{font-size:12px;font-weight:700;color:var(--brand2);margin:4px 0 5px}
.brhead b{color:var(--ink)}
table.br{width:100%;border-collapse:collapse;font-size:13.5px}
table.br td{padding:7px 2px;border-bottom:1px dashed var(--line)}
table.br td.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
table.br tr.muted td{color:var(--muted);font-weight:500}
table.br tr.total td{border-top:2px solid var(--ink);border-bottom:none;padding-top:11px;font-size:17px;font-weight:800}
table.br tr.total td.r{color:var(--brand2)}
.eff{text-align:right;color:var(--muted);font-size:12px;margin-top:4px}
.override{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
/* multi-box dimensions */
.dimhead{display:grid;grid-template-columns:1fr 1fr 1fr 62px 58px 24px;gap:6px;font-size:10.5px;
  font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;padding:0 1px}
.dimrow{display:grid;grid-template-columns:1fr 1fr 1fr 62px 58px 24px;gap:6px;margin-bottom:6px;align-items:center}
.dimrow input,.dimrow select{padding:8px 6px;font-size:13.5px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.dimrow .del{border:none;background:#f3e0e0;color:#b02a2a;border-radius:7px;height:30px;cursor:pointer;font-size:15px;font-weight:700;padding:0}
.dimrow .del:hover{background:#ecc9c9}
.addbtn{margin-top:2px;background:var(--chip);border:1px dashed var(--brand);color:var(--brand);
  border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.addbtn:hover{background:#e2edf9}
.dimtot{margin-top:9px;font-size:12px;color:var(--ink);font-weight:600}
.dimtot b{color:var(--brand2)}
/* actual freight reference cards */
.actwrap{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.actwrap h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 9px}
.actcard{display:flex;justify-content:space-between;gap:10px;background:#f6faf4;border:1px solid #d9e9d2;
  border-radius:9px;padding:9px 11px;margin-bottom:7px}
.actcard .al{font-size:13.5px;font-weight:700}
.actcard .am{font-size:11.5px;color:var(--muted);margin-top:2px}
.actcard .ar{text-align:right;white-space:nowrap}
.actcard .af{font-size:14px;font-weight:800;color:var(--good)}
.actcard .ae{font-size:11px;color:var(--muted);margin-top:2px}
.ftltag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#e4eefb;color:var(--brand2);margin-left:5px;vertical-align:middle}
.note{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.6}
.note b{color:var(--ink)}
.warnbox{background:#fbe9e9;border:1px solid #f2c9c9;color:#7a1f1f;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.okbox{background:#e9f5ec;border:1px solid #c5e3ce;color:#1c5c34;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.okbox b{color:#12351f}
.footer{margin-top:26px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
kbd{background:#eef1f5;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">ACPL</div>
    <div>
      <h1>Freight Rate Calculator</h1>
      <div class="sub">Part loads ex <b>Bhopal – Transport Nagar</b> &amp; vice-versa &nbsp;·&nbsp; Avinash Cargo Pvt. Ltd.</div>
    </div>
  </header>
  <div class="metabar" id="metabar"></div>

  <div class="grid">
    <!-- INPUT -->
    <div class="card">
      <h2>Shipment details</h2>
      <div class="field">
        <label>Destination pincode <span class="hint">— 6-digit delivery PIN</span></label>
        <input type="text" id="pin" inputmode="numeric" maxlength="6" placeholder="e.g. 560066" autocomplete="off">
      </div>
      <div class="field" style="max-width:50%">
        <label>Actual weight <span class="hint">(kg, total)</span></label>
        <input type="number" id="wt" min="0" step="1" placeholder="e.g. 250">
      </div>
      <div class="field">
        <label>Box dimensions <span class="hint">— add each box size; volumetric weight auto-calculated</span></label>
        <div class="dimhead"><span>Length</span><span>Breadth</span><span>Height</span><span>Unit</span><span>Boxes</span><span></span></div>
        <div id="dimRows"></div>
        <button type="button" id="addBox" class="addbtn">+ Add box size</button>
        <div class="dimtot" id="dimOut"></div>
      </div>
    </div>

    <!-- RESULT -->
    <div class="card" id="resultCard">
      <h2>Vehicle &amp; freight</h2>
      <div id="result"><div class="empty">Enter a <b>pincode</b>, <b>weight</b> and <b>box dimensions</b> to see the rate, the suggested vehicle and the freight.</div></div>
    </div>
  </div>

  <div class="footer" id="footer"></div>
</div>

    ['🚛','20 ft truck', '20×7×7 ft',     27.75, 8000,  62],   // ~7–8 T
    ['🚛','22 ft truck', '22×7.5×7.5 ft', 35.04, 10000, 72],   // ~7–10 T

      '<button type="button" class="del" title="remove this box size">×</button>';
    return d;
  }
  $('addBox').addEventListener('click',()=>{ $('dimRows').appendChild(makeRow()); });
  $('dimRows').addEventListener('input',()=>{ updateDimOut(); render(); });
  $('dimRows').addEventListener('change',()=>{ updateDimOut(); render(); });
  $('dimRows').addEventListener('click',e=>{
    if(!e.target.classList.contains('del')) return;
    const rows=document.querySelectorAll('#dimRows .dimrow');
    if(rows.length>1) e.target.closest('.dimrow').remove();
    else e.target.closest('.dimrow').querySelectorAll('input').forEach(i=>i.value='');
    updateDimOut(); render();
  });
  $('dimRows').appendChild(makeRow());  // start with one row

  // ---- wire inputs ----
  ['pin','wt'].forEach(id=>$(id).addEventListener('input',render));

  // ---- meta + footer ----
  $('metabar').innerHTML=
    '<span>Quote '+D.meta.ref+'</span><span>Rates valid '+D.meta.validity+'</span>'+
    '<span>'+D.dests.length+' quoted + all-India est.</span>';
  $('footer').innerHTML=
    '<b>Freight</b> = cheaper of two modes, so ₹/kg falls as weight rises: <b>Part-load</b> = dead weight × per-kg rate; <b>Full-truck</b> = distance from Bhopal × the truck\'s ₹/km (calibrated on your real bilties). Shown as the <b>accurate estimated cost</b> (no markup or discount). '+
    '<b>Vehicle</b> = smallest of your 7 trucks (14–32 ft, 32 ft up to ~35 T) fitting both volume (CBM @ '+(PACK*100)+'% packing) and weight (+1 T buffer). '+
    'Areas not in the quote (e.g. Bihar) use the rate of the quoted city at the closest distance from Bhopal — a placeholder until real rates are added. '+
    'Estimate only; add-on charges (GC, e-way, door, FOV, hamali, ODA) not included. Based on quotation '+D.meta.ref+' + your bilties; final billing by ACPL.';

  render();
})();
</script>
</body>
</html>
